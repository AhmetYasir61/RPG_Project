# All strings use MiniMessage formatting.
prefix: "<gradient:#f0c040:#e08020><bold>Aethel</bold></gradient> <dark_gray>»</dark_gray> "

command:
  player-only: "<red>This command can only be used in game.</red>"
  player-not-found: "<red>No such player.</red>"
  internal-error: "<red>Something went wrong. Staff have been notified.</red>"
  no-permission: "<red>You lack permission for that.</red>"
  help-header: "<gray>— <yellow>/<command></yellow> commands —</gray>"
  help-line: "<dark_gray>›</dark_gray> <yellow>/<command> <sub></yellow>"
  core:
    description: "Core administration"

core:
  modules-header: "<gray>— <yellow>Modules</yellow> —</gray>"
  modules-line: "<dark_gray>›</dark_gray> <white><id></white> <gray>(<name>)</gray> <dark_gray>-</dark_gray> <aqua><state></aqua>"
  module-enabled: "<green>Module enabled:</green> <white><id></white>"
  module-disabled: "<yellow>Module disabled:</yellow> <white><id></white>"
  module-action-failed: "<red>Action failed:</red> <white><id></white> <gray>(see console)</gray>"
  reloaded: "<green>Configuration and languages reloaded.</green>"
  version: "<gray>AethelCore version:</gray> <white><version></white>"

auth:
  required: "<red>You must log in first.</red>"
  timeout: "<red>Login timed out. Please reconnect.</red>"
  session-restored: "<green>Session restored, welcome back.</green>"
  gui-login: "<yellow>Enter your PIN to continue.</yellow>"
  gui-register: "<yellow>Register by choosing a PIN.</yellow>"
  gui-title-login: "<dark_gray>Enter your PIN"
  gui-title-register: "<dark_gray>Choose a PIN"
  gui-title-confirm: "<dark_gray>Repeat your PIN"
  web-login: "<yellow>Log in here: <aqua><click:open_url:'<url>'><underlined><url></underlined></click></aqua></yellow>"
  web-register: "<yellow>Register here: <aqua><click:open_url:'<url>'><underlined><url></underlined></click></aqua></yellow>"
  mismatch: "<red>PINs did not match, try again.</red>"
  login-success: "<green>Logged in. Have fun.</green>"
  login-failed: "<red>Wrong PIN.</red>"
  register-success: "<green>Registration complete.</green>"
  register-failed: "<red>Registration failed. The PIN may not meet the rules.</red>"

menu:
  invalid-number: "<red>Not a valid number:</red> <white><value></white>"

pack:
  declined: "<red>You must accept the resource pack to play here.</red>"
  failed: "<red>Resource pack download failed. Check your connection and retry.</red>"

economy:
  balance: "<gray>Balance:</gray> <gold><amount></gold>"
  insufficient: "<red>Not enough gold.</red>"
  paid: "<green>Paid <amount>.</green>"
  received: "<green>Received <amount>.</green>"

pcoins:
  received: "<light_purple><amount> <currency> added to your account.</light_purple>"
  balance: "<gray>PCoin balance:</gray> <light_purple><amount></light_purple>"
  offline: "<red>The store is unavailable right now, try again shortly.</red>"
  insufficient: "<red>Not enough PCoins.</red>"

region:
  no-build: "<red>You cannot build here.</red>"
  no-pvp: "<red>PvP is disabled in this region.</red>"
  entered: "<gray>Entered region:</gray> <white><region></white> <dark_gray>(<difficulty>)</dark_gray>"

loot:
  opened: "<green>Chest opened:</green> <white><count> items</white> <dark_gray>(rarity x<rarity>)</dark_gray>"
  cooldown: "<red>This chest has not refilled yet.</red> <gray><seconds>s</gray>"
  threat: "<gray>Area threat:</gray> <white><threat></white>"

panel:
  title: "<dark_gray>Admin Panel"
  command-description: "Opens the admin panel"
  current-mode: "<gray>Active panel mode:</gray> <white><mode></white>"
  web-link: "<yellow>Open panel: <aqua><click:open_url:'<url>'><underlined><url></underlined></click></aqua></yellow>"
  web-unavailable: "<red>The web panel is currently unavailable.</red>"
  selected: "<gray>Selected:</gray> <white><value></white>"
  saved: "<green>Saved.</green>"
  item-given: "<green>Item given:</green> <white><item></white>"
  enter-percent: "<dark_gray>Difficulty percent"
  pack-regenerating: "<yellow>Regenerating resource pack...</yellow>"

party:
  command-description: "Party commands"
  none: "<gray>You are not in a party.</gray> <dark_gray>/parti davet <player></dark_gray>"
  header: "<gray>— <yellow>Party</yellow> (<count> members) —</gray>"
  member: "<dark_gray>›</dark_gray> <white><player></white> <gray>(<status>)</gray>"
  invited: "<yellow><player> invited you to their party.</yellow> <dark_gray>/parti kabul</dark_gray>"
  invite-sent: "<green>Invite sent:</green> <white><player></white>"
  invite-failed: "<red>Could not send the invite.</red>"
  no-invite: "<red>You have no pending invite.</red>"
  joined: "<green><player> joined the party.</green>"
  left: "<yellow><player> left the party.</yellow>"
  new-leader: "<yellow>New leader:</yellow> <white><player></white>"
  tracking-on: "<green>Member tracking on. You will see your friends' positions.</green>"
  tracking-off: "<yellow>Member tracking off.</yellow>"

travel:
  command-description: "Travel and waypoint commands"
  header: "<gray>— <yellow>Waypoints</yellow> —</gray>"
  entry-known: "<dark_gray>›</dark_gray> <white><name></white> <dark_gray>(<id>)</dark_gray> <green>discovered</green>"
  entry-unknown: "<dark_gray>›</dark_gray> <dark_gray><name> — not discovered yet</dark_gray>"
  discovered: "<green>You discovered a new site:</green> <white><waypoint></white>"
  cast-started: "<yellow>You begin reading... hold still.</yellow>"
  casting: "<gray>Casting:</gray> <white><seconds>s</white>"
  cast-cancelled: "<red>The casting broke.</red>"
  arrived: "<green>You have arrived.</green>"
  no-scroll: "<red>You need a travel scroll.</red>"
  not-discovered: "<red>You must walk there yourself first.</red>"
  in-combat: "<red>You cannot teleport in combat.</red>"
  on-cooldown: "<red>Not ready yet.</red>"
  hearth-cooldown: "<red>Hearthstone not ready:</red> <white><seconds>s</white>"
  no-bind: "<red>You must bind a hearth location first.</red> <dark_gray>/waypoint bagla</dark_gray>"
  bound: "<green>Your hearth is now bound here.</green>"
  bind-failed: "<red>Could not bind.</red>"
  blocked: "<red>Teleporting is blocked here.</red>"

rpg:
  command-description: "Character, stats and skill tree"
  header: "<gray>— <yellow>Character</yellow> —</gray> <white>Lv.<level></white> <dark_gray>|</dark_gray> <gray>XP</gray> <white><xp></white> <dark_gray>|</dark_gray> <gray>Points</gray> <white><points></white>"
  stat-line: "<dark_gray>›</dark_gray> <gray><stat></gray> <white><value></white>"
  level-up: "<gold><bold>Level up!</bold></gold> <white>Lv.<level></white> <gray>(+<points> points)</gray>"
  point-spent: "<green>Point spent:</green> <white><stat></white>"
  no-points: "<red>You have no points to spend.</red>"
  unknown-stat: "<red>Unknown stat:</red> <white><stat></white>"
  tree-header: "<gray>— <yellow>Skill Tree</yellow> —</gray>"
  tree-unlocked: "<green>✔</green> <white><node></white> <dark_gray>(<id>)</dark_gray>"
  tree-locked: "<dark_gray>✖ <node> — <cost> points (<id>)</dark_gray>"
  node-unlocked: "<green>Unlocked:</green> <white><node></white>"
  unlock-unknown-node: "<red>No such node.</red>"
  unlock-already-unlocked: "<yellow>Already unlocked.</yellow>"
  unlock-level-too-low: "<red>Your level is too low.</red>"
  unlock-not-enough-points: "<red>Not enough points.</red>"
  unlock-missing-prerequisite: "<red>Unlock the prerequisite nodes first.</red>"

jobs:
  command-description: "Job commands"
  none: "<gray>You have no job yet.</gray> <dark_gray>/meslek liste</dark_gray>"
  header: "<gray>— <yellow>Your Jobs</yellow> —</gray>"
  entry: "<dark_gray>›</dark_gray> <white><job></white> <gray>Lv.<level> (<xp> XP)</gray>"
  available: "<gray>— <yellow>Jobs</yellow> —</gray>"
  available-entry: "<dark_gray>›</dark_gray> <white><job></white> <dark_gray>(<id>)</dark_gray>"
  joined: "<green>You joined:</green> <white><job></white>"
  already-joined: "<yellow>You already have this job.</yellow>"
  limit-reached: "<red>You can hold at most <max> jobs.</red>"
  on-cooldown: "<red>You must wait before joining a new job.</red>"
  unknown: "<red>No such job:</red> <white><job></white>"
  left: "<yellow>You left the job.</yellow> <gray>Wait <hours>h before joining a new one.</gray>"
  not-joined: "<red>You do not have this job.</red>"
  level-up: "<gold><job> level up:</gold> <white>Lv.<level></white>"
