# All strings use MiniMessage formatting.
prefix: "<gradient:#f0c040:#e08020><bold>Aethel</bold></gradient> <dark_gray>»</dark_gray> "

command:
  player-only: "<red>This command can only be used in game.</red>"
  player-not-found: "<red>No such player.</red>"
  internal-error: "<red>Something went wrong. Staff have been notified.</red>"
  no-permission: "<red>You lack permission for that.</red>"
  help-header: "<gray>— <yellow>/<command></yellow> commands —</gray>"
  help-line: "<dark_gray>›</dark_gray> <yellow>/<command> <sub></yellow>"
  core:
    description: "Core administration"

core:
  modules-header: "<gray>— <yellow>Modules</yellow> —</gray>"
  modules-line: "<dark_gray>›</dark_gray> <white><id></white> <gray>(<name>)</gray> <dark_gray>-</dark_gray> <aqua><state></aqua>"
  module-enabled: "<green>Module enabled:</green> <white><id></white>"
  module-disabled: "<yellow>Module disabled:</yellow> <white><id></white>"
  module-action-failed: "<red>Action failed:</red> <white><id></white> <gray>(see console)</gray>"
  reloaded: "<green>Configuration and languages reloaded.</green>"
  version: "<gray>AethelCore version:</gray> <white><version></white>"

auth:
  required: "<red>You must log in first.</red>"
  timeout: "<red>Login timed out. Please reconnect.</red>"
  session-restored: "<green>Session restored, welcome back.</green>"
  gui-login: "<yellow>Enter your PIN to continue.</yellow>"
  gui-register: "<yellow>Register by choosing a PIN.</yellow>"
  gui-title-login: "<dark_gray>Enter your PIN"
  gui-title-register: "<dark_gray>Choose a PIN"
  gui-title-confirm: "<dark_gray>Repeat your PIN"
  web-login: "<yellow>Log in here: <aqua><click:open_url:'<url>'><underlined><url></underlined></click></aqua></yellow>"
  web-register: "<yellow>Register here: <aqua><click:open_url:'<url>'><underlined><url></underlined></click></aqua></yellow>"
  mismatch: "<red>PINs did not match, try again.</red>"
  login-success: "<green>Logged in. Have fun.</green>"
  login-failed: "<red>Wrong PIN.</red>"
  register-success: "<green>Registration complete.</green>"
  register-failed: "<red>Registration failed. The PIN may not meet the rules.</red>"

menu:
  invalid-number: "<red>Not a valid number:</red> <white><value></white>"

pack:
  declined: "<red>You must accept the resource pack to play here.</red>"
  failed: "<red>Resource pack download failed. Check your connection and retry.</red>"

economy:
  balance: "<gray>Balance:</gray> <gold><amount></gold>"
  insufficient: "<red>Not enough gold.</red>"
  paid: "<green>Paid <amount>.</green>"
  received: "<green>Received <amount>.</green>"

pcoins:
  received: "<light_purple><amount> <currency> added to your account.</light_purple>"
  balance: "<gray>PCoin balance:</gray> <light_purple><amount></light_purple>"
  offline: "<red>The store is unavailable right now, try again shortly.</red>"
  insufficient: "<red>Not enough PCoins.</red>"

region:
  no-build: "<red>You cannot build here.</red>"
  no-pvp: "<red>PvP is disabled in this region.</red>"
  entered: "<gray>Entered region:</gray> <white><region></white> <dark_gray>(<difficulty>)</dark_gray>"

loot:
  opened: "<green>Chest opened:</green> <white><count> items</white> <dark_gray>(rarity x<rarity>)</dark_gray>"
  cooldown: "<red>This chest has not refilled yet.</red> <gray><seconds>s</gray>"
  threat: "<gray>Area threat:</gray> <white><threat></white>"
