# All strings use MiniMessage formatting.
prefix: "<gradient:#f0c040:#e08020><bold>Aethel</bold></gradient> <dark_gray>»</dark_gray> "

command:
  player-only: "<red>This command can only be used in game.</red>"
  player-not-found: "<red>No such player.</red>"
  internal-error: "<red>Something went wrong. Staff have been notified.</red>"
  no-permission: "<red>You lack permission for that.</red>"
  help-header: "<gray>— <yellow>/<command></yellow> commands —</gray>"
  help-line: "<dark_gray>›</dark_gray> <yellow>/<command> <sub></yellow>"
  core:
    description: "Core administration"

core:
  modules-header: "<gray>— <yellow>Modules</yellow> —</gray>"
  modules-line: "<dark_gray>›</dark_gray> <white><id></white> <gray>(<name>)</gray> <dark_gray>-</dark_gray> <aqua><state></aqua>"
  module-enabled: "<green>Module enabled:</green> <white><id></white>"
  module-disabled: "<yellow>Module disabled:</yellow> <white><id></white>"
  module-action-failed: "<red>Action failed:</red> <white><id></white> <gray>(see console)</gray>"
  reloaded: "<green>Configuration and languages reloaded.</green>"
  version: "<gray>AethelCore version:</gray> <white><version></white>"
