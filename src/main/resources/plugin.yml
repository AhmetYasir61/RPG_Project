name: ${serverName}Core
version: '${version}'
main: ${corePackage}.bootstrap.CorePlugin
api-version: '${apiVersion}'
folia-supported: true
author: ${serverName} Network
description: Tek JAR, cok modullu sunucu cekirdegi.

# Komutlarin tamami Brigadier uzerinden runtime'da kaydedilir (command framework).
# Burada yalnizca bootstrap komutu tanimli; digerleri modul yasam dongusunde gelir.
commands:
  core:
    description: Cekirdek yonetim komutu (modul, reload, debug).
    usage: /core <modules|reload|version>
    permission: core.admin

permissions:
  core.admin:
    description: Tum cekirdek yonetim yetkileri.
    default: op
  aethel.admin.panel:
    description: Yonetim panelini acma yetkisi (/adminmenu).
    default: op
  aethel.admin.*:
    description: Tum panel bolumleri.
    default: op
    children:
      aethel.admin.panel: true
      aethel.admin.items: true
      aethel.admin.skills: true
      aethel.admin.mobs: true
      aethel.admin.regions: true
      aethel.admin.loot: true
      aethel.admin.permissions: true
      aethel.admin.economy: true
      aethel.admin.pack: true
  aethel.profile.inspect:
    description: Baska oyuncularin profilini gorme yetkisi.
    default: op

softdepend:
  - PlaceholderAPI
  - Vault
