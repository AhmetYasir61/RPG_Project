# Modul kayit defteri. Her modul burada acilip kapatilabilir; sira ONEMLI DEGIL,
# ModuleManager @Module(depends=...) bilgisine gore topolojik siralar.
# Hot-disable: /core modules disable <id>  |  Hot-enable: /core modules enable <id>

modules:
  profile:      { enabled: true }
  auth:         { enabled: true,  mode: PIN }
  economy:      { enabled: true,  vault-provider: true }
  pcoins:       { enabled: false, endpoint: "" }
  jobs:         { enabled: true,  max-active-jobs: 2 }
  permissions:  { enabled: true,  default-group: "oyuncu" }
  content:      { enabled: true,  resource-pack: { generate: true, serve: true, port: 8085, required: true } }
  mob:          { enabled: true }
  skill:        { enabled: true }
  rpg:          { enabled: true }
  menu:         { enabled: true }
  quest:        { enabled: true }
  region:       { enabled: true }
  chat:         { enabled: true }
  party:        { enabled: true }
  travel:       { enabled: true,  free-teleport: false }
  hologram:     { enabled: true }
  waypoint:     { enabled: true }
  npc:          { enabled: true }
  placeholder:  { enabled: true,  papi-bridge: true }
  assets:       { enabled: true }
  hud:          { enabled: true }
  loot:         { enabled: true }
  dungeon:      { enabled: true }
  dialog:       { enabled: true }
  # Yonetim paneli: panel (oyun ici GUI) ve web AYNI ANDA acik olamaz.
  # Cekirdek boot'ta dogrular; ikisi de acikken web kapatilir ve uyari loglanir.
  panel:        { enabled: true }
  web:          { enabled: false, bind: "0.0.0.0", port: 8080 }

# Guvenlik agi: bir modul enable sirasinda patlarsa, bagimlilari otomatik devre disi
# kalir ve sunucu ayakta kalir (fail-soft). false yaparsan sunucu acilisi durur.
fail-soft: true
