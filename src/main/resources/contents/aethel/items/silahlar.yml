# Custom item tanimlari. Gorunum 2D texture + item_model bileseni ile saglanir.
# Texture yolu: contents/aethel/textures/<texture>
#
# sockets:
#   slots        : kac tas takilabilir
#   stages       : her asamanin gerektirdigi OLDURME sayisi (artan)
#   evolves-into : son asamada donusecegi item
bakir_kilic:
  display: "<#c87f4a>Bakir Kilic</#c87f4a>"
  lore:
    - "<dark_gray>« Yaygin »</dark_gray>"
    - ""
    - "<gray>Hasar</gray> <white>+4.0</white>"
  material: IRON_SWORD
  texture: "item/bakir_kilic.png"
  rarity: COMMON
  durability: 320
  attributes:
    damage: 4.0
    attack-speed: -2.4
  sockets:
    slots: 1
    stages: [0, 25, 100, 300]
    evolves-into: "alev_kilici"
  tags:
    - "silah"
    - "kilic"

alev_kilici:
  display: "<gradient:#ff6a00:#ffcc00><bold>Alev Kilici</bold></gradient>"
  lore:
    - "<dark_gray>« Nadir »</dark_gray>"
    - ""
    - "<gray>Hasar</gray> <white>+8.5</white>"
    - "<gray>Yanma</gray> <white>3sn</white>"
    - ""
    - "<dark_purple>Yetenek:</dark_purple> <light_purple>Alev Dalgasi</light_purple>"
  material: IRON_SWORD
  texture: "item/alev_kilici.png"
  rarity: RARE
  custom-model-data: 1001
  durability: 780
  glow: true
  attributes:
    damage: 8.5
    attack-speed: -2.2
  enchantments:
    fire_aspect: 2
  tags:
    - "silah"
    - "kilic"

sifa_iksiri:
  display: "<red>Sifa Iksiri</red>"
  lore:
    - "<gray>Anlik <white>40</white> can yeniler.</gray>"
  material: POTION
  texture: "item/sifa_iksiri.png"
  rarity: COMMON
  food:
    nutrition: 0
    saturation: 0.0
    always-edible: true
    eat-seconds: 1.2
  tags:
    - "tuketilebilir"

kesif_parsomeni:
