# AethelCore ana yapilandirmasi.
# schema-version cekirdek tarafindan yonetilir, elle degistirme.
schema-version: 1

language:
  default: tr
  available:
    - tr
    - en

profile:
  # Oyuncu verisinin periyodik flush araligi (saniye). Cikista zaten flush edilir.
  autosave-seconds: 300

performance:
  # Butceli isler icin tick basina ust sinir (ms). 20 TPS'te bir tick 50 ms surer.
  tick-budget-ms: 1.5

debug: false

# Yonetim paneli. GUI ve WEB birbirini disler; ikisi de acikken web devre disi kalir.
# Tek yonetim komutu: /adminmenu
admin:
  mode: GUI                 # GUI | WEB
  permission: aethel.admin.panel
  web:
    bind: "0.0.0.0"
    port: 8080
    public-url: "http://127.0.0.1:8080"
    session-timeout-minutes: 30
    # WEB modunda yetkili envantere mudahale edebilir; her islem denetim kaydina yazilir.
    allow-inventory-edit: true

# Giris/kayit. GUI modunda anvil ile, WEB modunda tarayici yonlendirmesi ile.
auth:
  mode: PIN                 # PIN | PASSWORD
  min-length: 4
  max-length: 32
  max-attempts: 5
  timeout-seconds: 60
  session-minutes: 30
  freeze-until-login: true
  web-token-seconds: 300

# Kaynak paketi: oyuncuya sorulmaz, zorunlu gonderilir.
resource-pack:
  generate: true
  generate-on-start: true
  serve: true
  bind: "0.0.0.0"
  port: 8085
  # Bos birakilirsa sunucunun kendi IP'si kullanilir.
  public-host: ""
  force: true

storage:
  # MYSQL veya SQLITE. 100 oyunculu bir MMORPG icin MYSQL onerilir.
  type: SQLITE
  mysql:
    host: 127.0.0.1
    port: 3306
    database: aethel
    username: aethel
    password: ""
    pool-size: 10
  sqlite:
    file: data.db
